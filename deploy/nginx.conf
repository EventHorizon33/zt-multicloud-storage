# nginx site for the SPA + same-origin API proxy (used by Dockerfile.frontend).
# The backend runs with ZT_TRUST_FORWARDED_FOR=true and ZT_TRUSTED_PROXY_HOPS=1:
# this proxy REPLACES X-Forwarded-For with exactly the peer address, so the
# chain always has one trusted entry (ADR-0011). Client-supplied values are
# discarded here.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads up to ZT_MAX_UPLOAD_BYTES (10 GiB in docker-compose.yml) + multipart overhead (about 1 MiB).
    # Keep this above the backend's cap; with the framework default of 256 MiB use 260m.
    client_max_body_size 10250m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;     # stream uploads to the backend
        # The backend sends nothing until the whole file is fetched and verified (time to first byte was 55 s
        # for 10 GiB over local emulators; real providers are slower), so this must exceed that time.
        proxy_read_timeout 1800s;        # verify-then-release downloads of large files
        proxy_send_timeout 300s;
    }

    # /metrics is deliberately NOT proxied: scrape the backend directly on the
    # internal network with ZT_METRICS_TOKEN (review finding L5).
    location = /metrics { return 404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
